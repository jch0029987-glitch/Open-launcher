name: Generate and Save Keystore Secret

on:
  workflow_dispatch:

jobs:
  generate-and-store:
    runs-on: ubuntu-latest
    permissions:
      secrets: write
      actions: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkey -v -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEYSTORE_ALIAS" \
            -keypass "$KEYSTORE_PASSWORD" \
            -storepass "$KEYSTORE_PASSWORD" \
            -dname "CN=Android Developer, OU=Development, O=Local, L=Unknown, ST=Unknown, C=US"

      - name: Save Secret via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Encode the keystore to base64
          ENCODED_KEY=$(base64 release-key.jks | tr -d '\n')
          
          # Use GitHub CLI to securely set the repository secret (encrypted on upload)
          gh secret set KEYSTORE_BASE64 --body "$ENCODED_KEY"
          
          echo "Keystore successfully generated and saved to repository secrets as KEYSTORE_BASE64!"
