name: Generate and Store Keystore Secret

on:
  workflow_dispatch:

jobs:
  generate-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore File
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkey -v -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEYSTORE_ALIAS" \
            -keypass "$KEYSTORE_PASSWORD" \
            -storepass "$KEYSTORE_PASSWORD" \
            -dname "CN=Android Developer, OU=Development, O=Local, L=Unknown, ST=Unknown, C=US"

      - name: Base64 Encode and Save to Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Encode keystore and strip newlines
          ENCODED_KEY=$(base64 release-key.jks | tr -d '\n')
          
          # Use GitHub CLI to securely encrypt and save the secret
          echo "$ENCODED_KEY" | gh secret set KEYSTORE_BASE64
          
          echo "Successfully updated KEYSTORE_BASE64 secret in repository!"
