name: Build and Deploy TV Launcher

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and Bootstrap Latest Gradle Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version latest
          chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Android ADB Tools
        run: sudo apt-get update && sudo apt-get install -y android-tools-adb

      - name: Deploy to Android TV
        env:
          TV_IP: ${{ secrets.TV_IP }}
        run: |
          adb connect ${{ env.TV_IP }}:5555
          adb devices
          adb shell am force-stop com.jeremy.launcher
          adb install -r app/build/outputs/apk/release/app-release.apk
          adb shell am start -n "com.jeremy.launcher/.MainActivity"
